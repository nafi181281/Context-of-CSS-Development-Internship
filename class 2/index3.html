<!DOCTYPE html>
<html>
<head>
  <title>Profile Card</title>
  
  <!-- গুগল ফন্টস (Poppins) লিঙ্ক করা হয়েছে -->
  <link href="https://cdn.imgpile.com/f/O75mpYz_lg.webp" rel="stylesheet" />
  
  <!-- এক্সটার্নাল সিএসএস ফাইল লিঙ্ক করা হয়েছে -->
  <link rel="stylesheet" href="index3.css" />
</head>
<body>
  <!-- প্রোফাইল কার্ড কন্টেইনার -->
  <div class="card">
    <!-- প্রফাইল অ্যাভাটার ছবি -->
    <img src="https://cdn.imgpile.com/f/O75mpYz_lg.webp" alt="Profile" class="avatar" />
    
    <!-- নাম ও রোল/পদবী -->
    <h1 class="name">NAFI UL SHEAK</h1>
    <p class="role">Web Developer</p>
    
    <!-- সংক্ষিপ্ত বায়ো/বিবরণ -->
    <p class="bio">I work with HTML, CSS, JS, and React. Based in Dhaka, Bangladesh.</p>
    
    <!-- যোগাযোগ বাটন -->
    <a href="#" class="btn">Contact</a>
  </div>
</body>
</html>
