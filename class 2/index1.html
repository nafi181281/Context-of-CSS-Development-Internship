<!DOCTYPE html>
<html>
<head>
  <title>Color Palette</title>
  <style>
    /* বডি টেক্সটের ফন্ট এবং লেখাগুলো সেন্টারে রাখার জন্য */
    body { font-family: sans-serif; text-align: center; }
    
    /* হেডিংয়ের রঙ ডার্ক গ্রে (#333) করা হয়েছে */
    h1 { color: #333; }
    
    /* সব বক্সের সাধারণ স্টাইল: সাইজ, ডিসপ্লে, মার্জিন এবং লেখা মাঝখানে আনার জন্য line-height */
    .box { width: 120px; height: 120px; display: inline-block; margin: 8px; color: white; line-height: 120px; }
    
    /* লাল বক্সের ব্যাকগ্রাউন্ড কালার */
    #red { background: #e63946; }
    
    /* নীল বক্সের ব্যাকগ্রাউন্ড কালার */
    #blue { background: #457b9d; }
    
    /* সবুজ বক্সের ব্যাকগ্রাউন্ড কালার */
    #green { background: #2a9d8f; }
    
    /* হলুদ বক্সের ব্যাকগ্রাউন্ড এবং টেক্সটের রঙ (#333) পরিবর্তন */
    #yellow { background: #f4a261; color: #333; }
  </style>
</head>
<body>
  <!-- প্রধান হেডিং -->
  <h1>My Colors</h1>
  
  <!-- প্রতিটি কালার বক্সের জন্য div -->
  <div class="box" id="red">Red</div>
  <div class="box" id="blue">Blue</div>
  <div class="box" id="green">Green</div>
  <div class="box" id="yellow">Yellow</div>
</body>
</html>
