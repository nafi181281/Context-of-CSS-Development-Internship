<!DOCTYPE html>
<html>
<head>
  <title>COSE WITH CSS</title>
  
  <!-- Internal CSS: <style> ট্যাগের মধ্যে সিএসএস কোড -->
  <style>
    body { background: #fff8e1; font-family: sans-serif; }
    h1 { color: tomato; text-align: center; }
  </style>
</head>
<body>
  <h1>NAFI UL SHEAK</h1>
  
  <!-- Inline CSS: ট্যাগের ভেতরে style attribute ব্যবহার করে সরাসরি প্রয়োগ করা হয়েছে -->
  <p style="color: navy; font-size: 20px;">এটা inline style</p>
</body>
</html>
